<div id="clients-list" class="mt-3 space-y-2">
  {% for c in clients %}
  <div class="flex items-center justify-between border rounded px-3 py-2 hover:bg-slate-50">
    <div><div class="font-medium text-sm">{{ c.name }}</div><div class="text-xs text-slate-500">{{ c.email }} • {{ c.currency }} {{ "%.2f"|format(c.rate) }}/h</div></div>
    <a href="/clients/{{ c.id }}" class="text-xs text-blue-600">Edit</a>
  </div>
  {% endfor %}
</div>
