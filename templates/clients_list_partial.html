<div id="clients-list" class="mt-4 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
  {% for c in clients %}
  <div class="bg-white rounded-[16px] border border-slate-200 p-4 flex items-center gap-3 shadow-soft">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-600 to-violet-600 text-white flex items-center justify-center font-bold flex-shrink-0">{{ c.name[0]|upper }}</div>
    <div class="min-w-0 flex-1">
      <div class="text-sm font-semibold truncate">{{ c.name }}</div>
      <div class="text-xs text-slate-500 truncate">{{ c.email or 'No email' }} • {{ c.currency }} {{ "%.0f"|format(c.rate) }}/h</div>
    </div>
    <a href="/clients/{{ c.id }}" class="text-xs font-semibold bg-slate-900 text-white px-3 py-1.5 rounded-full">Edit</a>
  </div>
  {% endfor %}
</div>
