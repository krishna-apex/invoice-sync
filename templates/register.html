{% extends "base.html" %}
{% block title %}Register — InvoiceSync{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg border shadow-sm">
  <h1 class="text-xl font-bold">Create account</h1>
  <p class="text-sm text-slate-500 mt-1">No email verification needed. Free = 5 invoices / month.</p>
  {% if error %}<div class="mt-3 bg-red-50 text-red-700 text-sm p-3 rounded border border-red-200">{{ error }}</div>{% endif %}
  <form method="post" action="/register" class="mt-4 space-y-3">
    <div>
      <label class="text-sm font-medium">Email</label>
      <input name="email" type="email" required class="mt-1 w-full border rounded px-3 py-2" placeholder="you@example.com">
    </div>
    <div>
      <label class="text-sm font-medium">Password</label>
      <input name="password" type="password" required minlength="6" class="mt-1 w-full border rounded px-3 py-2" placeholder="min 6 chars, PBKDF2 hashed">
    </div>
    <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Create account</button>
  </form>
  <div class="mt-4 text-sm text-center text-slate-500">Have account? <a href="/login" class="text-blue-600">Login</a></div>
</div>
{% endblock %}
