{% extends "base.html" %}
{% block title %}Client {{ client.name }} — InvoiceSync{% endblock %}
{% block content %}
<a href="/clients" class="text-sm text-blue-600">← Back to clients</a>
<h1 class="text-2xl font-bold mt-2">Edit client</h1>
<div class="mt-4 bg-white border rounded-lg p-4 max-w-xl">
  <form method="post" action="/clients/{{ client.id }}" class="space-y-3">
    <div><label class="text-sm font-medium">Name</label><input name="name" value="{{ client.name }}" required class="mt-1 w-full border rounded px-3 py-2 text-sm"></div>
    <div><label class="text-sm font-medium">Email</label><input name="email" value="{{ client.email or '' }}" class="mt-1 w-full border rounded px-3 py-2 text-sm"></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-sm font-medium">Currency</label><input name="currency" value="{{ client.currency }}" class="mt-1 w-full border rounded px-3 py-2 text-sm"></div>
      <div><label class="text-sm font-medium">Hourly rate</label><input name="rate" value="{{ client.rate }}" type="number" step="0.01" class="mt-1 w-full border rounded px-3 py-2 text-sm"></div>
    </div>
    <div><label class="text-sm font-medium">Custom invoice fields (JSON or PO:123, tax:456)</label><input name="custom_fields" value="{{ client.custom_fields_json or '' }}" class="mt-1 w-full border rounded px-3 py-2 text-sm font-mono"></div>
    <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Save</button>
  </form>
  <form method="post" action="/clients/{{ client.id }}/delete" class="mt-3" onsubmit="return confirm('Delete client?')"><button class="w-full bg-red-50 text-red-700 border border-red-200 py-2 rounded hover:bg-red-100">Delete client</button></form>
</div>

<div class="mt-6 text-sm text-slate-500">Tip: custom fields appear on PDF (e.g., PO number, tax ID). Use HTMX for inline updates in future.</div>
{% endblock %}
